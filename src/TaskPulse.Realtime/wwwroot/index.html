<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>WebSocket Console</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #eef0f3;
      --border: #d9dde3;
      --text: #1a1d21;
      --text-muted: #5f6672;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --err: #b91c1c;
      --err-bg: #fee2e2;
      --in: #1d4ed8;
      --out: #15803d;
      --sys: #6b7280;
      --radius: 10px;
      --shadow: 0 1px 2px rgb(0 0 0 / .06), 0 4px 16px rgb(0 0 0 / .05);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2b323c;
        --text: #e6e9ee; --text-muted: #9aa3b0; --accent: #60a5fa; --accent-text: #0b1220;
        --ok: #4ade80; --ok-bg: #0f2e1a; --warn: #fbbf24; --warn-bg: #3a2a08; --err: #f87171; --err-bg: #3b1212;
        --in: #93c5fd; --out: #86efac; --sys: #9aa3b0;
        --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1f242c; --border: #2b323c;
      --text: #e6e9ee; --text-muted: #9aa3b0; --accent: #60a5fa; --accent-text: #0b1220;
      --ok: #4ade80; --ok-bg: #0f2e1a; --warn: #fbbf24; --warn-bg: #3a2a08; --err: #f87171; --err-bg: #3b1212;
      --in: #93c5fd; --out: #86efac; --sys: #9aa3b0;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 16px rgb(0 0 0 / .35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font);
      display: grid; grid-template-rows: auto 1fr; min-height: 100dvh;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: .5rem .85rem; transition: background .12s, border-color .12s, transform .05s; }
    button:hover:not(:disabled) { background: var(--surface-2); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
    button.danger { color: var(--err); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type=text], select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .55rem .7rem; min-width: 0;
    }
    input[type=text]:focus, select:focus { border-color: var(--accent); }
    code, .mono { font-family: var(--mono); font-size: .92em; }
    .muted { color: var(--text-muted); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    header {
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
      padding: .8rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border);
      padding-top: calc(.8rem + env(safe-area-inset-top, 0px));
    }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: -.01em; }
    header .endpoint { color: var(--text-muted); }
    header .spacer { flex: 1; }
    .pill {
      display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .7rem; border-radius: 999px;
      font-weight: 600; font-size: .82rem; background: var(--surface-2); border: 1px solid var(--border);
    }
    .pill::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--sys); }
    .pill[data-state="open"]       { background: var(--ok-bg);   color: var(--ok);   border-color: transparent; }
    .pill[data-state="open"]::before { background: var(--ok); }
    .pill[data-state="connecting"] { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
    .pill[data-state="connecting"]::before { background: var(--warn); animation: pulse 1s infinite; }
    .pill[data-state="closed"]     { background: var(--err-bg);  color: var(--err);  border-color: transparent; }
    .pill[data-state="closed"]::before { background: var(--err); }
    @keyframes pulse { 50% { opacity: .3; } }

    main {
      display: grid; grid-template-columns: 300px 1fr; gap: 1rem; padding: 1rem 1.25rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); min-height: 0;
    }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin: 0; padding: .8rem 1rem .4rem; }

    aside { display: flex; flex-direction: column; gap: 1rem; }
    .actions { display: flex; gap: .5rem; padding: .5rem 1rem 1rem; }
    .actions button { flex: 1; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .75rem; padding: .3rem 1rem 1rem; }
    .stat { display: flex; flex-direction: column; gap: .1rem; }
    .stat dt { font-size: .74rem; color: var(--text-muted); }
    .stat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat dd.mono { font-weight: 500; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .35rem 1rem; }
    .toggle:last-child { padding-bottom: .9rem; }
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .clients { list-style: none; margin: 0; padding: 0 1rem .9rem; display: flex; flex-direction: column; gap: .25rem; max-height: 10rem; overflow: auto; }
    .clients li { display: flex; justify-content: space-between; gap: .5rem; font-size: .82rem; }
    .clients li.me { font-weight: 600; }
    .clients li .id { font-family: var(--mono); }

    section.log { display: grid; grid-template-rows: auto 1fr auto; min-height: 60dvh; }
    .log-bar { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .6rem .8rem; border-bottom: 1px solid var(--border); }
    .log-bar .filters { display: flex; gap: .3rem; flex-wrap: wrap; }
    .chip { padding: .25rem .6rem; border-radius: 999px; font-size: .78rem; border: 1px solid var(--border); background: transparent; }
    .chip[aria-pressed="true"] { background: var(--surface-2); border-color: var(--accent); }
    .log-body { overflow: auto; padding: .4rem 0; font-family: var(--mono); font-size: .82rem; scroll-behavior: smooth; }
    .log-body:empty::before { content: "No messages yet. Connect and send something."; display: block; padding: 2rem; text-align: center; color: var(--text-muted); font-family: var(--font); }
    .msg { display: grid; grid-template-columns: 6.5rem 5.5rem 1fr; gap: .6rem; padding: .3rem .8rem; border-left: 3px solid transparent; align-items: start; }
    .msg:hover { background: var(--surface-2); }
    .msg time { color: var(--text-muted); white-space: nowrap; }
    .msg .badge { font-size: .72rem; font-weight: 700; padding: .1rem .45rem; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; justify-self: start; white-space: nowrap; }
    .msg .body { white-space: pre-wrap; word-break: break-word; }
    .msg.in  { border-left-color: var(--in); }  .msg.in  .badge { background: color-mix(in srgb, var(--in) 18%, transparent);  color: var(--in); }
    .msg.out { border-left-color: var(--out); } .msg.out .badge { background: color-mix(in srgb, var(--out) 18%, transparent); color: var(--out); }
    .msg.sys { border-left-color: var(--sys); } .msg.sys .badge { background: color-mix(in srgb, var(--sys) 18%, transparent); color: var(--sys); }
    .msg.err { border-left-color: var(--err); } .msg.err .badge { background: var(--err-bg); color: var(--err); }
    .msg .body .k { color: var(--text-muted); }
    .msg .body .from { font-weight: 600; }
    @media (max-width: 560px) { .msg { grid-template-columns: 1fr; gap: .15rem; } }

    .composer { display: grid; grid-template-columns: auto 1fr auto; gap: .5rem; padding: .7rem .8rem; border-top: 1px solid var(--border); }
    .composer .hint { grid-column: 1 / -1; font-size: .76rem; color: var(--text-muted); }
    .composer .hint kbd { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3em; }
    @media (max-width: 560px) { .composer { grid-template-columns: 1fr 1fr; } .composer input { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    <h1>WebSocket Console</h1>
    <span class="endpoint mono" id="endpoint" title="Same host as this page, so it works through nginx and directly">—</span>
    <span class="spacer"></span>
    <span class="pill" id="status" data-state="closed" role="status" aria-live="polite">disconnected</span>
    <button id="theme" type="button" aria-label="Toggle colour theme" title="Toggle theme">◐</button>
  </header>

  <main>
    <aside>
      <div class="card">
        <h2>Connection</h2>
        <div class="actions">
          <button id="connect" type="button" class="primary">Connect</button>
          <button id="disconnect" type="button" class="danger" disabled>Disconnect</button>
        </div>
        <dl class="stats">
          <div class="stat"><dt>Your id</dt><dd class="mono" id="myId">—</dd></div>
          <div class="stat"><dt>Connections</dt><dd id="connCount">—</dd></div>
          <div class="stat"><dt>Sent</dt><dd id="sent">0</dd></div>
          <div class="stat"><dt>Received</dt><dd id="received">0</dd></div>
          <div class="stat"><dt>Last round-trip</dt><dd id="rtt">—</dd></div>
          <div class="stat"><dt>Server uptime</dt><dd id="uptime">—</dd></div>
        </dl>
        <label class="toggle"><span>Auto-reconnect <span class="muted">(backoff)</span></span>
          <span class="switch"><input type="checkbox" id="autoReconnect" checked><span></span></span></label>
        <label class="toggle"><span>Auto-scroll log</span>
          <span class="switch"><input type="checkbox" id="autoScroll" checked><span></span></span></label>
      </div>

      <div class="card">
        <h2>Connected clients <span class="muted" id="clientsNote">(from /stats)</span></h2>
        <ul class="clients" id="clients"><li class="muted">—</li></ul>
      </div>
    </aside>

    <section class="log card" aria-label="Message log">
      <div class="log-bar">
        <div class="filters" role="group" aria-label="Filter by direction">
          <button type="button" class="chip" data-filter="in"  aria-pressed="true">incoming</button>
          <button type="button" class="chip" data-filter="out" aria-pressed="true">outgoing</button>
          <button type="button" class="chip" data-filter="sys" aria-pressed="true">system</button>
        </div>
        <span class="spacer" style="flex:1"></span>
        <span class="muted" id="count">0 messages</span>
        <button type="button" id="clear">Clear</button>
      </div>
      <div class="log-body" id="log" aria-live="polite" aria-relevant="additions"></div>
      <form class="composer" id="composer">
        <label class="sr-only" for="type">Message type</label>
        <select id="type">
          <option value="echo">echo</option>
          <option value="broadcast">broadcast</option>
          <option value="ping">ping</option>
          <option value="raw">raw text</option>
        </select>
        <label class="sr-only" for="text">Message</label>
        <input id="text" type="text" autocomplete="off" placeholder="Message text" value="hello from the browser">
        <button type="submit" id="send" class="primary" disabled>Send</button>
        <span class="hint"><kbd>Enter</kbd> send · <kbd>Ctrl</kbd>+<kbd>K</kbd> clear log · open a second tab and use <b>broadcast</b> to see fan-out</span>
      </form>
    </section>
  </main>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const now = () => new Date().toISOString().slice(11, 23);
    const fmtDuration = (s) => {
      if (!Number.isFinite(s)) return '—';
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
      return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
    };
    const CLOSE_REASONS = {
      1000: 'normal closure', 1001: 'endpoint going away (server shutdown / navigation)',
      1005: 'no status received', 1006: 'connection dropped without a close frame (abnormal)',
      1008: 'policy violation', 1009: 'message too big', 1011: 'server error', 1012: 'service restart',
    };

    (() => {
      const root = document.documentElement;
      let stored = null;
      try { stored = localStorage.getItem('theme'); } catch { }
      if (stored) root.dataset.theme = stored;
      $('theme').addEventListener('click', () => {
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        const current = root.dataset.theme || (dark ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch { }
      });
    })();

    const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
    $('endpoint').textContent = url;

    const state = {
      ws: null,
      myId: null,
      sent: 0,
      received: 0,
      wantOpen: false,
      reconnectAttempt: 0,
      reconnectTimer: null,
      pingSentAt: null,
      filters: { in: true, out: true, sys: true },
      count: 0,
    };

    const log = $('log');

    function render(kind, badge, body) {
      const row = document.createElement('div');
      row.className = `msg ${kind}`;
      row.hidden = !state.filters[kind === 'err' ? 'in' : kind];

      const t = document.createElement('time');
      t.textContent = now();

      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = badge;

      const c = document.createElement('div');
      c.className = 'body';
      if (typeof body === 'string') c.textContent = body;
      else c.append(...body);

      row.append(t, b, c);
      log.appendChild(row);
      state.count++;
      $('count').textContent = `${state.count} message${state.count === 1 ? '' : 's'}`;
      if ($('autoScroll').checked) log.scrollTop = log.scrollHeight;
    }

    const kv = (key, value) => {
      const k = document.createElement('span'); k.className = 'k'; k.textContent = `${key}=`;
      const v = document.createElement('span'); v.textContent = value;
      return [k, v, document.createTextNode('  ')];
    };

    function renderIncoming(raw) {
      let m;
      try { m = JSON.parse(raw); } catch { render('in', 'text', raw); return; }

      switch (m.type) {
        case 'welcome':
          state.myId = m.connectionId;
          $('myId').textContent = m.connectionId;
          $('connCount').textContent = m.connections;
          render('sys', 'welcome', [...kv('you', m.connectionId), ...kv('connections', m.connections)]);
          break;
        case 'system':
          $('connCount').textContent = m.connections;
          render('sys', m.event, [...kv('client', m.connectionId), ...kv('connections', m.connections)]);
          break;
        case 'pong':
          if (state.pingSentAt) { $('rtt').textContent = `${(performance.now() - state.pingSentAt).toFixed(1)} ms`; state.pingSentAt = null; }
          render('in', 'pong', kv('from', m.from));
          break;
        case 'echo':
        case 'broadcast': {
          const from = document.createElement('span');
          from.className = 'from';
          from.textContent = m.from === state.myId ? 'you' : m.from;
          render('in', m.type, [from, document.createTextNode(': '), document.createTextNode(m.data ?? '')]);
          break;
        }
        case 'changed':
          render('in', 'changed', [...kv('who', m.actor ?? 'anonymous'), ...kv('did', `${m.action} ${m.resource}${m.kind ? '/' + m.kind : ''}`), ...kv('id', String(m.id).slice(0, 8))]);
          break;
        case 'error':
          render('err', 'error', m.error ?? raw);
          break;
        default:
          render('in', m.type ?? 'message', raw);
      }
    }

    function setStatus(stateName, label) {
      const pill = $('status');
      pill.dataset.state = stateName;
      pill.textContent = label;
      const open = stateName === 'open';
      $('connect').disabled = open || stateName === 'connecting';
      $('disconnect').disabled = !open && stateName !== 'connecting';
      $('send').disabled = !open;
      if (!open) { $('myId').textContent = '—'; }
    }

    function connect() {
      clearTimeout(state.reconnectTimer);
      state.wantOpen = true;
      setStatus('connecting', state.reconnectAttempt ? `reconnecting (try ${state.reconnectAttempt})` : 'connecting…');

      const ws = new WebSocket(url);
      state.ws = ws;

      ws.addEventListener('open', () => {
        state.reconnectAttempt = 0;
        setStatus('open', 'connected');
        render('sys', 'open', url);
        $('text').focus();
      });

      ws.addEventListener('message', (e) => {
        state.received++; $('received').textContent = state.received;
        renderIncoming(e.data);
      });

      ws.addEventListener('error', () => render('err', 'error', 'socket error — see browser console'));

      ws.addEventListener('close', (e) => {
        state.ws = null;
        setStatus('closed', 'disconnected');
        const why = CLOSE_REASONS[e.code] ?? 'unknown code';
        render(e.wasClean ? 'sys' : 'err', 'closed',
          [...kv('code', `${e.code} (${why})`), ...kv('reason', e.reason || '—'), ...kv('clean', e.wasClean)]);
        scheduleReconnect();
      });
    }

    function disconnect() {
      state.wantOpen = false;
      state.reconnectAttempt = 0;
      clearTimeout(state.reconnectTimer);
      state.ws?.close(1000, 'user clicked disconnect');
    }

    function scheduleReconnect() {
      if (!state.wantOpen || !$('autoReconnect').checked) return;
      state.reconnectAttempt++;
      const delay = Math.min(30_000, 500 * 2 ** (state.reconnectAttempt - 1)) * (0.8 + Math.random() * 0.4);
      render('sys', 'retry', `reconnecting in ${(delay / 1000).toFixed(1)}s (attempt ${state.reconnectAttempt})`);
      state.reconnectTimer = setTimeout(connect, delay);
    }

    function send(type, text) {
      if (state.ws?.readyState !== WebSocket.OPEN) return;
      const payload = type === 'raw' ? text : JSON.stringify(type === 'ping' ? { type } : { type, data: text });
      if (type === 'ping') state.pingSentAt = performance.now();
      state.ws.send(payload);
      state.sent++; $('sent').textContent = state.sent;
      render('out', type, payload);
    }

    async function pollStats() {
      try {
        const r = await fetch('/stats', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const s = await r.json();
        $('uptime').textContent = fmtDuration(s.uptimeSeconds);
        $('connCount').textContent = s.connections;
        const ul = $('clients');
        ul.replaceChildren(...(s.clients.length ? s.clients.map((c) => {
          const li = document.createElement('li');
          if (c.id === state.myId) li.classList.add('me');
          const id = document.createElement('span'); id.className = 'id'; id.textContent = c.id === state.myId ? `${c.id} (you)` : c.id;
          const n = document.createElement('span'); n.className = 'muted'; n.textContent = `↓${c.messagesReceived} ↑${c.messagesSent}`;
          li.append(id, n);
          return li;
        }) : [Object.assign(document.createElement('li'), { className: 'muted', textContent: 'none' })]));
        $('clientsNote').textContent = '(from /stats)';
      } catch {
        $('clientsNote').textContent = '(/stats unreachable)';
      }
    }

    $('connect').addEventListener('click', () => { state.reconnectAttempt = 0; connect(); });
    $('disconnect').addEventListener('click', disconnect);
    $('composer').addEventListener('submit', (e) => { e.preventDefault(); send($('type').value, $('text').value); });
    $('clear').addEventListener('click', () => { log.replaceChildren(); state.count = 0; $('count').textContent = '0 messages'; });
    document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('clear').click(); } });
    document.querySelectorAll('.chip[data-filter]').forEach((chip) => chip.addEventListener('click', () => {
      const f = chip.dataset.filter;
      state.filters[f] = !state.filters[f];
      chip.setAttribute('aria-pressed', String(state.filters[f]));
      log.querySelectorAll(`.msg.${f}${f === 'in' ? ', .msg.err' : ''}`).forEach((row) => { row.hidden = !state.filters[f]; });
    }));
    window.addEventListener('beforeunload', () => { state.wantOpen = false; state.ws?.close(1000, 'page unload'); });

    pollStats();
    setInterval(pollStats, 3000);
    connect();
  </script>
</body>
</html>
