services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskpulse
      POSTGRES_USER: taskpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskpulse-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpulse -d taskpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Tasks: "Host=postgres;Port=5432;Database=taskpulse;Username=taskpulse;Password=${POSTGRES_PASSWORD:-taskpulse-local-only}"
      Api__MaxPageSize: "200"
      Api__UploadDirectory: "/data/uploads"
      Api__JwtSecret: "${TASKPULSE_JWT_SECRET:-compose-only-secret-change-me-32-chars}"
      Api__RealtimeInternalUrl: "http://realtime:8080/internal/broadcast"
      Api__RealtimeInternalToken: "${TASKPULSE_INTERNAL_TOKEN:-compose-internal-token}"
    volumes:
      - uploads:/data
    ports:
      - "5080:8080"
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: deploy/docker/realtime.Dockerfile
    environment:
      WebSocket__KeepAliveIntervalSeconds: "20"
      WebSocket__InternalToken: "${TASKPULSE_INTERNAL_TOKEN:-compose-internal-token}"
      WebSocket__JwtSecret: "${TASKPULSE_JWT_SECRET:-compose-only-secret-change-me-32-chars}"
    ports:
      - "5090:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - realtime
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/taskpulse.compose.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
