services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taskpulse
      POSTGRES_USER: taskpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskpulse-local-only}
    volumes:
      # postgres:18 images keep the cluster in a version subdirectory under /var/lib/postgresql (pg_upgrade friendly)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpulse -d taskpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__Tasks: "Host=postgres;Port=5432;Database=taskpulse;Username=taskpulse;Password=${POSTGRES_PASSWORD:-taskpulse-local-only}"
      Api__MaxPageSize: "200"
      Api__UploadDirectory: "/data/uploads"
      Api__JwtSecret: "${TASKPULSE_JWT_SECRET:-compose-only-secret-change-me-32-chars}"
      Api__RealtimeInternalUrl: "http://realtime:8080/internal/broadcast"
      Api__RealtimeInternalToken: "${TASKPULSE_INTERNAL_TOKEN:-compose-internal-token}"
      Api__AuditIngestToken: "${TASKPULSE_AUDIT_TOKEN:-compose-audit-token}"
      Api__RedisUrl: "redis:6379"
      Api__AllowedOrigins__0: "${TASKPULSE_ALLOWED_ORIGIN:-http://127.0.0.1:8080}"
    volumes:
      - uploads:/data
    ports:
      - "5080:8080"
    restart: unless-stopped

  realtime:
    build:
      context: .
      dockerfile: deploy/docker/realtime.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      WebSocket__KeepAliveIntervalSeconds: "20"
      WebSocket__InternalToken: "${TASKPULSE_INTERNAL_TOKEN:-compose-internal-token}"
      WebSocket__JwtSecret: "${TASKPULSE_JWT_SECRET:-compose-only-secret-change-me-32-chars}"
      WebSocket__RedisUrl: "redis:6379"
      WebSocket__NodeName: "realtime-1"
    ports:
      - "5090:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - realtime
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/taskpulse.compose.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  redisdata:
