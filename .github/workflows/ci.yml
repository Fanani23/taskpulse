name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskpulse_dev
          POSTGRES_PASSWORD: taskpulse_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskpulse_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TASKPULSE_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=taskpulse_dev;Password=taskpulse_dev
      TASKPULSE_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: NuGet package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore TaskPulse.sln
      - name: Format check (style rules from .editorconfig)
        run: dotnet format TaskPulse.sln --verify-no-changes --no-restore --exclude src/TaskPulse.Api/Data/Migrations
      - name: Build (warnings are errors)
        run: dotnet build TaskPulse.sln -c Release --no-restore
      - name: Known-vulnerable packages fail the build
        run: |
          dotnet list TaskPulse.sln package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          if grep -qE "(High|Critical)" vulnerable.txt; then echo "::error::known-vulnerable package(s) listed above"; exit 1; fi
      - name: Test (real PostgreSQL, one throw-away database per test class)
        run: dotnet test TaskPulse.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Shell scripts are valid
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t taskpulse-api:ci .
          docker build -f deploy/docker/realtime.Dockerfile -t taskpulse-realtime:ci .
