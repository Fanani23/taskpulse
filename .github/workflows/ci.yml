name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskpulse_dev
          POSTGRES_PASSWORD: taskpulse_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskpulse_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TASKPULSE_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=taskpulse_dev;Password=taskpulse_dev
      TASKPULSE_TEST_REDIS: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: NuGet package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore TaskPulse.sln
      - name: Format check (style rules from .editorconfig)
        run: dotnet format TaskPulse.sln --verify-no-changes --no-restore --exclude src/TaskPulse.Api/Data/Migrations
      - name: Build (warnings are errors)
        run: dotnet build TaskPulse.sln -c Release --no-restore
      - name: Known-vulnerable packages fail the build
        run: |
          dotnet list TaskPulse.sln package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          if grep -qE "(High|Critical)" vulnerable.txt; then echo "::error::known-vulnerable package(s) listed above"; exit 1; fi
      - name: Test (real PostgreSQL, one throw-away database per test class) with line coverage
        run: |
          dotnet test TaskPulse.sln -c Release --no-build --logger "trx;LogFileName=results.trx" \
            --collect:"XPlat Code Coverage" --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Coverage summary (line rate per project, and the total in the job summary)
        run: |
          total_l=0; total_c=0
          for f in TestResults/*/coverage.cobertura.xml; do
            rate=$(grep -o 'line-rate="[0-9.]*"' "$f" | head -1 | cut -d'"' -f2)
            lines=$(grep -o 'lines-valid="[0-9]*"' "$f" | head -1 | cut -d'"' -f2)
            covered=$(grep -o 'lines-covered="[0-9]*"' "$f" | head -1 | cut -d'"' -f2)
            total_l=$((total_l + lines)); total_c=$((total_c + covered))
            printf '%s: %.1f%% (%s/%s lines)\n' "$(basename "$(dirname "$f")")" "$(echo "$rate*100" | bc -l)" "$covered" "$lines"
          done
          pct=$(echo "scale=1; 100*$total_c/$total_l" | bc -l)
          echo "line coverage: ${pct}% ($total_c/$total_l)"
          echo "### Line coverage: **${pct}%** ($total_c of $total_l lines, both services)" >> "$GITHUB_STEP_SUMMARY"
          # floor: a change that drops coverage below this fails the build
          test "$(echo "$pct >= 60" | bc -l)" = 1
      - name: Shell scripts are valid
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            TestResults/**/coverage.cobertura.xml

  docker:
    runs-on: ubuntu-latest
    env:
      TASKPULSE_JWT_SECRET: ci-only-jwt-secret-shared-by-express-and-taskpulse-48
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t taskpulse-api:ci .
          docker build -f deploy/docker/realtime.Dockerfile -t taskpulse-realtime:ci .
      - name: Compose stack up
        run: |
          docker compose up -d --build --quiet-pull
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8088/health/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fs http://127.0.0.1:8088/health/ready
      - name: Restore drill (backup, purge, restore, verify)
        run: bash scripts/restore-drill.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 80
