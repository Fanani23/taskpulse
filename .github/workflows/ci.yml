name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskpulse_dev
          POSTGRES_PASSWORD: taskpulse_dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskpulse_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      TASKPULSE_TEST_PG: Host=localhost;Port=5432;Database=postgres;Username=taskpulse_dev;Password=taskpulse_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TaskPulse.sln
      - name: Format check (style rules from .editorconfig)
        run: dotnet format TaskPulse.sln --verify-no-changes --no-restore --exclude src/TaskPulse.Api/Data/Migrations
      - name: Build (warnings are errors)
        run: dotnet build TaskPulse.sln -c Release --no-restore
      - name: Test (real PostgreSQL, one throw-away database per test class)
        run: dotnet test TaskPulse.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Shell scripts are valid
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t taskpulse-api:ci .
          docker build -f deploy/docker/realtime.Dockerfile -t taskpulse-realtime:ci .
