map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream taskpulse_api  { server api:8080;  keepalive 16; }
upstream taskpulse_realtime { server realtime:8080; }

server {
    listen 80;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Security headers, inherited by every location (none of them sets add_header itself). The console page keeps
    # its script and styles in files so the policy can forbid inline code.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/     { proxy_pass http://taskpulse_api; proxy_http_version 1.1; proxy_set_header Connection ""; }
    location /health   { proxy_pass http://taskpulse_api; }
    location /openapi/ { proxy_pass http://taskpulse_api; }

    location /internal/ { return 404; }
    location /metrics  { allow 127.0.0.1; deny all; proxy_pass http://taskpulse_api; }

    location /ws {
        proxy_pass         http://taskpulse_realtime;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / { proxy_pass http://taskpulse_realtime; }
}
